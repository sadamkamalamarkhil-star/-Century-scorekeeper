<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Century">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="manifest" href="site.webmanifest">
<title>Century Scorekeeper</title>
<style>
:root{
  --bg:#04120e;
  --bg2:#071f18;
  --panel:#0b1713;
  --panel2:#101c18;
  --panel3:#14251f;
  --line:#1d493b;
  --line-soft:#17372e;
  --text:#f8fafc;
  --muted:#93a39d;
  --accent:#10b981;
  --accent-soft:#123d30;
  --gold:#f59e0b;
  --gold-soft:rgba(245,158,11,.12);
  --danger:#fb7185;
  --red:#be123c;
  --yellow:#eab308;
  --green:#16a34a;
  --brown:#92400e;
  --blue:#2563eb;
  --pink:#ec4899;
  --black:#0f172a;
  --shadow:0 14px 42px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#04120e;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 25%,rgba(19,84,66,.36) 0,rgba(10,45,36,.18) 35%,transparent 62%),
    linear-gradient(180deg,#071a14 0%,#04120e 46%,#020b08 100%);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,select{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.975)}
.app{width:min(100%,920px);margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:4px 2px 13px;border-bottom:1px solid rgba(16,185,129,.14);margin-bottom:12px
}
.brandWrap{display:flex;align-items:center;gap:11px;min-width:0}
.logoOrb{
  width:44px;height:44px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 32%,#1f7058 0,#0d3b2e 48%,#061d17 100%);
  border:1px solid rgba(245,158,11,.48);box-shadow:0 0 24px rgba(245,158,11,.18);
  color:var(--gold);font-size:20px;font-weight:900
}
.logoOrb{overflow:hidden}.logoOrb img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.brand{font-weight:900;letter-spacing:-.025em;font-size:20px;color:#fff;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brandBadge{
  font-size:9px;line-height:1;padding:5px 7px;border-radius:999px;
  border:1px solid rgba(245,158,11,.34);background:rgba(245,158,11,.1);color:#fbbf24;
  letter-spacing:.1em;text-transform:uppercase;font-weight:900
}
.subtitle{font-size:10px;color:rgba(52,211,153,.68);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{
  display:grid;grid-template-columns:1fr 1fr;background:rgba(2,10,8,.74);padding:4px;
  border:1px solid rgba(51,65,85,.7);border-radius:15px;min-width:190px;box-shadow:inset 0 0 18px rgba(0,0,0,.2)
}
.mode button{
  border:1px solid transparent;border-radius:11px;padding:10px 13px;background:transparent;
  color:#82928c;font-size:11px;font-weight:900;transition:.15s
}
.mode button.active{
  color:#fcd34d;background:rgba(245,158,11,.13);border-color:rgba(245,158,11,.42);
  box-shadow:0 0 18px rgba(245,158,11,.1)
}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px;
  background:rgba(10,20,17,.88);border:1px solid rgba(16,185,129,.2);border-radius:17px;padding:9px 10px;
  box-shadow:0 10px 26px rgba(0,0,0,.16);backdrop-filter:blur(10px)
}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.chip{
  background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.23);color:#fbbf24;
  font-size:9px;font-weight:900;border-radius:10px;padding:6px 8px;text-transform:uppercase;letter-spacing:.07em
}
.chip.good{color:#6ee7b7;border-color:rgba(16,185,129,.32);background:rgba(16,185,129,.09)}
.actions{display:flex;gap:5px;flex-shrink:0}
.iconBtn{
  width:37px;height:37px;border-radius:11px;border:1px solid rgba(71,85,105,.72);
  background:rgba(30,41,59,.64);color:#d9e3df;font-size:17px;display:grid;place-items:center;
  transition:.15s;box-shadow:inset 0 1px rgba(255,255,255,.03)
}
.iconBtn:hover{border-color:rgba(245,158,11,.42);color:#fbbf24;background:rgba(51,65,85,.72)}
.iconBtn:disabled{opacity:.26}
.players{display:grid;gap:9px}
.players.p2{grid-template-columns:repeat(2,minmax(0,1fr))}
.players.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
.players.p4{grid-template-columns:repeat(2,minmax(0,1fr))}
.player{
  min-width:0;border:1px solid rgba(51,65,85,.7);
  background:linear-gradient(160deg,rgba(15,23,42,.93),rgba(6,31,24,.9));
  border-radius:20px;padding:12px;text-align:left;color:var(--text);position:relative;overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.22);transition:.18s
}
.player:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,rgba(16,185,129,.08),transparent 40%);pointer-events:none}
.player.active{
  border-color:#10b981;box-shadow:0 0 25px rgba(16,185,129,.25),0 12px 28px rgba(0,0,0,.28);
  outline:1px solid rgba(16,185,129,.35);outline-offset:-2px
}
.player .name{font-size:11px;color:#d1ddd8;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.player.active .name{color:#fbbf24}
.player .score{font-size:38px;line-height:1;font-weight:900;margin:7px 0 5px;font-variant-numeric:tabular-nums;position:relative}
.player .meta{font-size:9px;color:#83928c;font-weight:700;position:relative}
.progress{height:5px;background:#17231f;border-radius:999px;overflow:hidden;margin-top:8px;position:relative}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#f59e0b,#fb7185);border-radius:999px}
.badge{
  display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:rgba(16,185,129,.12);color:#6ee7b7;
  border:1px solid rgba(16,185,129,.3);padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.05em
}
.status{
  margin-top:10px;background:rgba(15,23,42,.82);border:1px solid rgba(16,185,129,.2);border-radius:16px;
  padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#8fa19a;flex-wrap:wrap;
  box-shadow:0 8px 22px rgba(0,0,0,.15)
}
.status b{color:#fff;font-size:12px}.status span:first-child b{color:#fbbf24}
.passPanel{
  margin-top:9px;border:1px solid rgba(245,158,11,.36);
  background:linear-gradient(135deg,rgba(190,18,60,.11),rgba(245,158,11,.055));
  border-radius:16px;padding:10px;box-shadow:0 0 22px rgba(245,158,11,.07)
}
.passTitle{font-size:9px;color:#fbbf24;font-weight:900;text-transform:uppercase;letter-spacing:.11em;margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ballGrid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;
  background:linear-gradient(160deg,rgba(15,23,42,.82),rgba(6,31,24,.68));
  border:1px solid rgba(27,99,78,.34);border-radius:20px;padding:10px
}
.ball{
  height:66px;border-radius:16px;border:1px solid rgba(255,255,255,.12);font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset -4px -5px 9px rgba(0,0,0,.42),0 7px 16px rgba(0,0,0,.24);transition:.14s
}
.ball:not(:disabled){outline:1px solid rgba(245,158,11,.22);outline-offset:-2px}
.ball:not(:disabled):hover{filter:brightness(1.08);box-shadow:inset -4px -5px 9px rgba(0,0,0,.35),0 0 16px rgba(245,158,11,.2)}
.ball strong{font-size:22px;line-height:1}.ball span{font-size:8px;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
.ball:disabled{opacity:.28;filter:grayscale(.6);cursor:not-allowed}
.red{background:linear-gradient(145deg,#e11d48,#881337);color:white}
.yellow{background:linear-gradient(145deg,#fde047,#ca8a04);color:#171717}
.green{background:linear-gradient(145deg,#22c55e,#166534);color:white}
.brown{background:linear-gradient(145deg,#b45309,#713f12);color:white}
.blue{background:linear-gradient(145deg,#3b82f6,#1e40af);color:white}
.pink{background:linear-gradient(145deg,#f472b6,#be185d);color:#171717}
.black{background:linear-gradient(145deg,#263246,#05070a);color:white}
.secondary,.danger,.primary,.smallBtn,.option,.tab,.filter,.close{transition:.14s}
.secondary{
  background:rgba(30,41,59,.72);border:1px solid rgba(71,85,105,.72);color:#e8efec;
  border-radius:14px;padding:12px;font-weight:850
}
.secondary:hover{background:rgba(51,65,85,.8);border-color:rgba(245,158,11,.28)}
.danger{
  background:rgba(120,53,15,.2);border:1px solid rgba(245,158,11,.35);color:#fcd34d;
  border-radius:14px;padding:12px;font-weight:850
}
.danger:hover{background:rgba(146,64,14,.3)}
.primary{
  background:linear-gradient(145deg,#135442,#0d3b2e);border:1px solid rgba(245,158,11,.38);color:#fff;
  border-radius:14px;padding:12px;font-weight:900;box-shadow:0 0 22px rgba(245,158,11,.09)
}
.controls{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.controls.century{grid-template-columns:repeat(2,1fr)}
.panel{
  margin-top:8px;border:1px solid rgba(27,99,78,.4);
  background:linear-gradient(150deg,rgba(15,23,42,.94),rgba(7,31,24,.92));
  border-radius:17px;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.18)
}
.panelLabel{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:#fbbf24;margin-bottom:7px;font-weight:900}
.recent{
  margin-top:12px;border:1px solid rgba(27,99,78,.28);
  background:rgba(7,20,16,.5);border-radius:17px;padding:10px
}
.recentHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.recentHead .label{font-size:9px;color:#fbbf24;text-transform:uppercase;letter-spacing:.12em;font-weight:900}
.smallBtn{
  border:1px solid rgba(71,85,105,.65);background:rgba(30,41,59,.62);color:#9fb0a8;
  border-radius:9px;padding:7px 9px;font-size:9px;font-weight:900
}
.smallBtn:hover{color:#fbbf24;border-color:rgba(245,158,11,.35)}
.logline{
  font-size:10px;color:#aab8b2;background:rgba(15,23,42,.62);border:1px solid rgba(51,65,85,.48);
  border-radius:9px;padding:8px 9px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.winner{
  margin-top:11px;border:1px solid rgba(245,158,11,.42);
  background:radial-gradient(circle at 50% 0,rgba(245,158,11,.12),transparent 42%),linear-gradient(160deg,rgba(15,23,42,.96),rgba(6,31,24,.94));
  border-radius:23px;padding:19px;text-align:center;box-shadow:0 0 28px rgba(245,158,11,.12),var(--shadow)
}
.winner .eyebrow{font-size:9px;color:#fbbf24;text-transform:uppercase;letter-spacing:.16em;font-weight:900}
.winner h2{margin:6px 0 10px;font-size:26px}.finalRow{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:5px 0;color:#93a39d}.finalRow b{color:#f8fafc}
.sheetBackdrop{
  position:fixed;inset:0;background:rgba(2,6,5,.84);display:none;align-items:center;justify-content:center;
  z-index:50;padding:14px;backdrop-filter:blur(10px)
}
.sheetBackdrop.show{display:flex}
.sheet{
  width:min(100%,590px);max-height:90vh;background:linear-gradient(160deg,#0f172a,#071f18);
  border:1px solid rgba(245,158,11,.35);border-radius:26px;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  overflow:auto;box-shadow:0 0 28px rgba(245,158,11,.12),0 26px 60px rgba(0,0,0,.5)
}
.sheetHead{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:-14px;
  background:linear-gradient(180deg,#0e1723 75%,rgba(14,23,35,.94));padding:10px 0;z-index:2
}
.sheetTitle{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#fff}
.close{width:35px;height:35px;border:1px solid rgba(71,85,105,.72);background:#1e293b;color:#cbd5e1;border-radius:11px}
.tabs,.filters{display:flex;gap:6px;overflow:auto;padding-bottom:5px}
.tab,.filter{
  white-space:nowrap;border:1px solid rgba(71,85,105,.64);background:rgba(15,23,42,.8);color:#94a3b8;
  padding:9px 11px;border-radius:11px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em
}
.tab.active,.filter.active{background:rgba(245,158,11,.15);color:#fbbf24;border-color:rgba(245,158,11,.45)}
.sectionTitle{font-size:9px;color:#fbbf24;text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin:15px 0 7px}
.field{margin-top:10px}
.field label{display:block;font-size:9px;color:#a3b2ac;margin-bottom:5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.field input,.field select{
  width:100%;background:#1e293b;color:#f8fafc;border:1px solid #334155;border-radius:13px;padding:12px;font-size:16px;outline:none
}
.field input:focus,.field select:focus{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,.1)}
.inlineOptions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.option{border:1px solid #334155;background:#1e293b;color:#cbd5e1;border-radius:12px;padding:11px;font-weight:850}
.option.active{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.45)}
.resultCard,.statCard{
  border:1px solid rgba(51,65,85,.72);background:linear-gradient(155deg,rgba(15,23,42,.92),rgba(6,31,24,.72));
  border-radius:15px;padding:11px;margin-top:8px
}
.resultTop{display:flex;justify-content:space-between;gap:8px}.resultMode{font-size:8px;text-transform:uppercase;color:#fbbf24;font-weight:900;letter-spacing:.11em}
.resultDate{font-size:9px;color:#718079}.resultWinner{font-weight:900;margin-top:5px;font-size:13px}.resultScores{font-size:10px;color:#9ba9a3;margin-top:4px}
.resultDetails{display:none;border-top:1px solid rgba(51,65,85,.6);margin-top:8px;padding-top:7px}.resultCard.open .resultDetails{display:block}
.statName{font-weight:900;color:#f8fafc}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.statBox{background:rgba(30,41,59,.62);border:1px solid rgba(51,65,85,.55);border-radius:10px;padding:8px;text-align:center}.statBox strong{display:block;font-size:15px}.statBox span{font-size:7px;text-transform:uppercase;color:#8b9a94}
.empty{padding:28px 10px;text-align:center;color:#7f8f88;font-size:11px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.summary>div{background:rgba(15,23,42,.72);border:1px solid rgba(27,99,78,.36);border-radius:12px;padding:10px;text-align:center}.summary strong{display:block;font-size:19px}.summary span{font-size:8px;color:#8d9d96;text-transform:uppercase}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#17241f;color:#f8fafc;border:1px solid rgba(245,158,11,.32);border-radius:999px;padding:9px 13px;
  font-size:10px;z-index:80;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 10px 30px rgba(0,0,0,.38)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.confirmBar{margin-top:8px;border:1px solid rgba(245,158,11,.32);background:rgba(120,53,15,.14);border-radius:14px;padding:10px}
.confirmBar p{margin:0 0 9px;font-size:11px;color:#e8ddd0}.row{display:flex;gap:7px}.row>*{flex:1}.kicker{font-size:9px;color:#86968f;margin-top:6px}
.lastActionCard{margin-top:10px;border:1px solid rgba(245,158,11,.32);background:linear-gradient(160deg,rgba(15,23,42,.9),rgba(8,36,28,.88));border-radius:18px;padding:11px 12px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.lastActionLabel{font-size:9px;color:#fbbf24;text-transform:uppercase;letter-spacing:.12em;font-weight:900;margin-bottom:4px}
.lastActionText{font-size:13px;color:#f8fafc;font-weight:800;line-height:1.35}
.controlDock{position:sticky;bottom:10px;z-index:12;padding-top:10px;margin-top:10px;background:linear-gradient(180deg,rgba(4,18,14,0) 0%,rgba(4,18,14,.7) 20%,rgba(4,18,14,.95) 60%,rgba(4,18,14,.98) 100%)}
.controls{align-items:stretch}
.controls.century{grid-template-columns:2fr 1fr}
.missPrimary{grid-column:span 1;min-height:76px;border-color:rgba(245,158,11,.48)!important;background:linear-gradient(145deg,#135442,#0d3b2e)!important;color:#fff!important;font-size:16px;display:flex;flex-direction:column;justify-content:center;gap:5px;box-shadow:0 0 22px rgba(16,185,129,.14),0 8px 20px rgba(0,0,0,.22)}
.missPrimary b{font-size:17px;letter-spacing:.02em}
.missPrimary small{font-size:10px;color:#d8ebe4}
.app.tableLandscape{width:min(100%,1320px);padding:10px 12px calc(18px + env(safe-area-inset-bottom))}
.app.tableLandscape .top{padding-bottom:9px;margin-bottom:8px}
.app.tableLandscape .toolbar{margin-bottom:8px;padding:10px 12px}
.app.tableLandscape .players.p4{grid-template-columns:repeat(4,minmax(0,1fr))}
.app.tableLandscape .player{padding:14px;border-radius:22px}
.app.tableLandscape .player .name{font-size:14px}
.app.tableLandscape .player .score{font-size:48px;margin:10px 0 6px}
.app.tableLandscape .player .meta{font-size:11px}
.app.tableLandscape .badge{font-size:10px;padding:5px 8px}
.app.tableLandscape .status{font-size:13px;padding:13px 14px;border-radius:18px}
.app.tableLandscape .status b{font-size:18px}
.app.tableLandscape .lastActionCard{margin-top:8px;padding:13px 14px}
.app.tableLandscape .lastActionText{font-size:15px}
.app.tableLandscape .passPanel{padding:12px}
.app.tableLandscape .ballGrid{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:12px;border-radius:22px}
.app.tableLandscape .ball{height:84px;border-radius:18px}
.app.tableLandscape .ball strong{font-size:28px}
.app.tableLandscape .ball span{font-size:10px}
.app.tableLandscape .controls{grid-template-columns:2fr 1fr 1fr;gap:10px}
.app.tableLandscape .controls.century{grid-template-columns:2fr 1fr}
.app.tableLandscape .missPrimary{min-height:88px;font-size:18px}
.app.tableLandscape .recent{margin-top:8px}
.app.tableLandscape .recentHead .label{font-size:11px}
.app.tableLandscape .logline{font-size:12px;padding:10px 12px}
.app.tableLandscape .winner h2{font-size:32px}
@media (orientation: landscape){.app{width:min(100%,1320px);padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.players.p4{grid-template-columns:repeat(4,minmax(0,1fr))}.player .score{font-size:44px}.status{font-size:12px}.status b{font-size:16px}.ballGrid{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:12px}.ball{height:80px}.ball strong{font-size:26px}.ball span{font-size:10px}.controls{grid-template-columns:2fr 1fr 1fr}.controls.century{grid-template-columns:2fr 1fr}.missPrimary{min-height:84px}.lastActionText{font-size:14px}}

.slotCard,.rosterCard{background:linear-gradient(180deg,rgba(15,23,42,.26),rgba(7,31,24,.5));border:1px solid rgba(29,73,59,.9);border-radius:18px;padding:12px;margin-bottom:10px}
.slotHead,.rosterHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.slotTitle,.rosterTitle{font-size:12px;font-weight:900;color:#f8fafc}
.slotMeta{font-size:10px;color:var(--muted);font-weight:700}
.seatDot{width:11px;height:11px;border-radius:999px;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 10px rgba(255,255,255,.08)}
.nameRow{display:flex;align-items:center;gap:7px;min-width:0}
.nameRow .nameText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.playerTypeBadge{font-size:9px;line-height:1;padding:4px 6px;border-radius:999px;border:1px solid rgba(148,163,184,.28);background:rgba(15,23,42,.35);color:#cbd5e1;font-weight:900;letter-spacing:.08em;text-transform:uppercase}

function makeProfile(name){return{id:uid(),name:(name||"Regular Player").trim()||"Regular Player",createdAt:now()}}

/* Club session clock is intentionally independent of both game engines. */
const clubTimerDefaults={club:"Snooker club",currency:"AFN",hourlyRate:0,billing:"exact"};
function cleanClubTimer(raw){
  const settings={...clubTimerDefaults,...(raw&&raw.settings||{})};
  settings.club=String(settings.club||"Snooker club").trim().slice(0,60)||"Snooker club";
  settings.currency=String(settings.currency||"AFN").replace(/[^\w .-]/g,"").trim().slice(0,12)||"AFN";
  settings.hourlyRate=Number.isFinite(Number(settings.hourlyRate))?Math.min(100000000,Math.max(0,Number(settings.hourlyRate))):0;
  if(!["exact","half","hour"].includes(settings.billing))settings.billing="exact";
  const candidate=raw&&raw.active;
  const active=candidate&&["running","paused"].includes(candidate.status)&&Number.isFinite(candidate.startedAt)?{
    id:String(candidate.id||uid()),status:candidate.status,startedAt:candidate.startedAt,
    segmentStart:Number.isFinite(candidate.segmentStart)?candidate.segmentStart:null,
    elapsedMs:Math.max(0,Number(candidate.elapsedMs)||0)
  }:null;
  if(active&&active.status==="running"&&!Number.isFinite(active.segmentStart))active.segmentStart=active.startedAt;
  const history=Array.isArray(raw&&raw.history)?raw.history.filter(x=>x&&typeof x==="object").slice(0,30):[];
  return{settings,active,history};
}
let timerState=cleanClubTimer(read(K.clubTimer,null));
function saveClubTimer(){write(K.clubTimer,timerState)}
function timerElapsedMs(at=now()){
  const a=timerState.active;if(!a)return 0;
  return Math.max(0,a.elapsedMs+(a.status==="running"?Math.max(0,at-a.segmentStart):0));
}
function timerEstimate(totalMs=timerElapsedMs()){
  const rate=timerState.settings.hourlyRate,rounding=timerState.settings.billing;
  const billableMs=totalMs<=0?0:rounding==="half"?Math.ceil(totalMs/1800000)*1800000:rounding==="hour"?Math.ceil(totalMs/3600000)*3600000:totalMs;
  return{billableMs,charge:Math.round((billableMs/3600000*rate+Number.EPSILON)*100)/100};
}
function formatTimer(ms){const t=Math.floor(Math.max(0,ms)/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),sec=t%60;return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0")}

function billingLabel(kind){return kind==="half"?"30-minute blocks":kind==="hour"?"Full hours":"Exact time"}

  return `<button id="clubTimerBtn" class="clubTimerRibbon ${live?"active "+a.status:""}" aria-label="Open club session timer"><span class="timerIdentity"><span class="timerIcon">⏱</span><span><span class="timerTitle">CLUB TIMER</span><br><span class="timerCaption">${esc(status)}</span></span></span><span class="timerNumbers">${live?`<span class="timerDigits" data-clock="elapsed">${formatTimer(timerElapsedMs())}</span><span class="timerBill" data-clock="estimate">${esc(timerState.settings.currency)} ${formatMoney(price.charge)}</span>`:`<span class="timerBill">START</span>`}<span class="timerArrow">›</span></span></button>`;

function updateTimerDisplay(){
  if(!timerState.active)return;
  const elapsed=formatTimer(timerElapsedMs()),estimate=timerEstimate();

  if(!(timerState.settings.hourlyRate>0))return false;
  const t=now();timerState.active={id:uid(),status:"running",startedAt:t,segmentStart:t,elapsedMs:0};
  saveClubTimer();timerRedraw();return true;

  a.elapsedMs=timerElapsedMs();a.segmentStart=null;a.status="paused";
  saveClubTimer();timerRedraw();return true;

  const a=timerState.active;if(!a||a.status!=="paused")return false;
  a.segmentStart=now();a.status="running";saveClubTimer();timerRedraw();return true;
}

  const a=timerState.active;if(!a)return null;
  const endedAt=now(),totalMs=timerElapsedMs(endedAt),cost=timerEstimate(totalMs),settings={...timerState.settings};

"secondary" id="freeMiss">Miss · spend 1</button></div></div>`;body+=`<div class="ballGrid">${[["Red",10,"red"],["Yellow",2,"yellow"],["Green",3,"green"],["Brown",4,"brown"],["Blue",5,"blue"],["Pink",6,"pink"],["Black",7,"black"]].map(([n,v,c])=>`<button class="ball ${c}" data-cpot="${v}" data-name="${n}" ${cCanScore(v)?"":"disabled"}><strong>${v}</strong><span>${n}</span></button>`).join("")}<button class="danger" id="missRed"><b>Miss red</b><br><small>${cProtected()?"free passes":"−10 · end"}</small></button></div><div class="controlDock"><div class="controls century"><button class="secondary missPrimary" id="missNext"><b>MISS / END TURN</b><small>Most-used action</small></button><button class="danger" id="foulToggle">Foul</button></div></div>${subPanel==="cfoul"?`<div class="panel"><div class="panelLabel">Foul penalty</div><div class="four">${[4,5,6,7].map(v=>`<button class="danger" data-cfoul="${v}">−${v}</button>`).join("")}</div></div>`:""}`}body+=recentHTML(cState.log,4,"New game");return body}
function sBallButton(name,value,cls,key){return `<button class="ball ${cls}" data-spot="${key}" ${sCanPot(key)?"":"disabled"}><strong>${value}</strong><span>${name}</span></button>`}function freePanelHTML(){const generic=sState.ballOn==="colour"&&!sState.clearance;return `<div class="panel"><div class="panelLabel">Free ball${generic?" · choose actual ball-on value":""}</div>${generic?`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:7px">${[2,3,4,5,6,7].map(v=>`<button class="option ${freeBallOnValue===v?"active":""}" data-onv="${v}">${v}</button>`).join("")}</div>`:""}<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px">${colors.map(([k,n])=>`<button class="ball ${k}" style="height:46px" data-free="${k}" ${generic&&!freeBallOnValue?"disabled":""}><strong style="font-size:14px">${n.slice(0,3)}</strong></button>`).join("")}</div></div>`}
function snookerHTML(){const chips=`<span class="chip">🔴 ${sState.reds} Reds</span><span class="chip good">${sState.respotted?"⚫ RESPOTTED BLACK":sState.ballOn==="colour"?"● COLOUR ON":"● "+String(sState.ballOn).toUpperCase()+" ON"}</span>`;let body=appHeader()+toolBar(sTL.past.length>0,sTL.future.length>0,chips)+timerRibbonHTML()+`<div class="players p2">${sState.scores.map((sc,i)=>`<button class="player ${i===sState.active?"active":""}" data-splayer="${i}"><div class="name">${playerNameHTML(sDisplayName(i),sState.matchRefs?.[i]||sSettings.slots[i])}</div><div class="score">${sc}</div><div class="meta">${i===sState.active?"Break "+sState.break:"High "+sState.best[i]} ${typeBadgeHTML((sState.matchRefs?.[i]||sSettings.slots[i])?.kind)}</div></button>`).join("")}</div>`;if(sState.winner!==null){body+=`<div class="winner"><div class="eyebrow">Frame winner</div><h2>${esc(sDisplayName(sState.winner))}</h2><div class="finalRow"><span>${esc(sDisplayName(0))}</span><b>${sState.scores[0]} · high ${sState.best[0]}</b></div><div class="finalRow"><span>${esc(sDisplayName(1))}</span><b>${sState.scores[1]} · high ${sState.best[1]}</b></div><div class="kicker">${esc(sState.reason||"")}</div><div class="two" style="margin-top:9px"><button class="primary" id="winnerNew">New frame</button><button class="secondary" id="viewResult">View result</button></div></div>`}else{const rem=sState.respotted?7:(sState.clearance?clearance.slice(Math.max(0,clearance.indexOf(sState.ballOn))).reduce((a,c)=>a+val[c],0):sState.reds*8+27+(sState.ballOn==="colour"?7:0));body+=`<div class="status"><span>Striker <b>${esc(sDisplayName(sState.active))}</b></span><span>Break <b>${sState.break}</b></span><span>Remaining <b>${rem}</b></span></div>`+lastActionHTML(sState.log,"Ready for the next shot.")+`<div class="ballGrid">${sBallButton("Red",1,"red","red")}${colors.map(([k,n,v])=>sBallButton(n,v,k,k)).join("")}</div><div class="controlDock"><div class="controls"><button class="secondary missPrimary" id="sMiss"><b>MISS / END TURN</b><small>Most-used action</small></button><button class="danger" id="sFoulToggle">Foul</button><button class="secondary" id="freeToggle" ${sState.respotted?"disabled":""}>Free ball</button></div></div>${subPanel==="sfoul"?`<div class="panel"><div class="panelLabel">Points to ${esc(sDisplayName(1-sState.active))}</div><div class="four">${[4,5,6,7].map(v=>`<button class="danger" data-sfoul="${v}">+${v}</button>`).join("")}</div></div>`:""}${subPanel==="free"?freePanelHTML():""}<div style="margin-top:8px;text-align:right"><button class="smallBtn" id="concede">Concede frame</button></div>`}body+=recentHTML(sState.log,5,"New frame");return body}
function render(){document.title=(mode==="century"?"Century":"Snooker")+" Scorekeeper";const app=document.getElementById("app");app.className="app"+(isTableLayout()?" tableLandscape":"");document.body.classList.toggle("table-landscape",isTableLayout());app.innerHTML=mode==="century"?centuryHTML():snookerHTML();bindMain();if(openPanel==="history"||openPanel==="settings"||openPanel==="timer")renderSheet()}
function bindMain(){document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));const tb=document.getElementById("tableBtn");if(tb)tb.onclick=toggleTableMode;document.getElementById("clubTimerBtn").onclick=openTimer;document.getElementById("logBtn").onclick=()=>openHistory("log");document.getElementById("settingsBtn").onclick=openSettings;document.getElementById("viewAll").onclick=()=>openHistory("log");if(mode==="century"){document.getElementById("undoBtn").onclick=cUndo;document.getElementById("redoBtn").onclick=cRedo;document.querySelectorAll("[data-cplayer]").forEach(b=>b.onclick=()=>cSelect(Number(b.dataset.cplayer)));document.querySelectorAll("[data-cpot]").forEach(b=>b.onclick=()=>cPot(b.dataset.name,Number(b.dataset.cpot)));const fp=document.getElementById("freePot");if(fp)fp.onclick=()=>cPot("Red",10,true);const fm=document.getElementById("freeMiss");if(fm)fm.onclick=cFreeMiss;const mr=document.getElementById("missRed");if(mr)mr.onclick=cMissRed;const mn=document.getElementById("missNext");if(mn)mn.onclick=cMissNext;const ft=document.getElementById("foulToggle");if(ft)ft.onclick=()=>{subPanel=subPanel==="cfoul"?null:"cfoul";render()};document.querySelectorAll("[data-cfoul]").forEach(b=>b.onclick=()=>{subPanel=null;cFoul(Number(b.dataset.cfoul))});const nb=document.getElementById("newBtn");if(nb)nb.onclick=()=>cState.winner!==null?cReset():(cHasProgress()?askConfirm("Start a new Century game and discard the current unfinished game?",cReset):cReset());const wn=document.getElementById("winnerNew");if(wn)wn.onclick=cReset;const vr=document.getElementById("viewResult");if(vr)vr.onclick=()=>openHistory("results")}else{document.getElementById("undoBtn").onclick=sUndo;document.getElementById("redoBtn").onclick=sRedo;document.querySelectorAll("[data-splayer]").forEach(b=>b.onclick=()=>sSelect(Number(b.dataset.splayer)));document.querySelectorAll("[data-spot]").forEach(b=>b.onclick=()=>sPot(b.dataset.spot));const sm=document.getElementById("sMiss");if(sm)sm.onclick=sMiss;const sf=document.getElementById("sFoulToggle");if(sf)sf.onclick=()=>{subPanel=subPanel==="sfoul"?null:"sfoul";render()};document.querySelectorAll("[data-sfoul]").forEach(b=>b.onclick=()=>{subPanel=null;sFoul(Number(b.dataset.sfoul))});const fr=document.getElementById("freeToggle");if(fr)fr.onclick=()=>{subPanel=subPanel==="free"?null:"free";freeBallOnValue=null;render()};document.querySelectorAll("[data-onv]").forEach(b=>b.onclick=()=>{freeBallOnValue=Number(b.dataset.onv);render()});document.querySelectorAll("[data-free]").forEach(b=>b.onclick=()=>{subPanel=null;sFreeBall(b.dataset.free)});const cc=document.getElementById("concede");if(cc)cc.onclick=()=>askConfirm("Concede this frame?",sConcede);const nb=document.getElementById("newBtn");if(nb)nb.onclick=()=>sState.winner!==null?sReset():(sHasProgress()?askConfirm("Start a new snooker frame and discard the current unfinished frame?",sReset):sReset());const wn=document.getElementById("winnerNew");if(wn)wn.onclick=sReset;const vr=document.getElementById("viewResult");if(vr)vr.onclick=()=>openHistory("results")}}
document.getElementById("sheetBackdrop").addEventListener("click",e=>{if(e.target.id==="sheetBackdrop")closeSheet()});if(window.matchMedia){const mq=window.matchMedia("(orientation: landscape)");if(mq.addEventListener)mq.addEventListener("change",()=>{if(!tableMode)render()});else if(mq.addListener)mq.addListener(()=>{if(!tableMode)render()})}syncCResult();syncSResult();saveCentury();saveSnooker();render();setInterval(updateTimerDisplay,1000);document.addEventListener("visibilitychange",updateTimerDisplay);
})();
