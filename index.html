<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CueScore">
<link rel="apple-touch-icon" href="cuescore-icon.png">
<link rel="icon" type="image/png" sizes="64x64" href="cuescore-icon.png">
<link rel="manifest" href="site.webmanifest">
<title>CueScore | Club Snooker</title>
<style>
:root{
  --bg:#080b1e;
  --seat-accent:#a78bfa;
  --bg2:#141b3a;
  --panel:#111933;
  --panel2:#1c2447;
  --panel3:#202a50;
  --line:#3e4b85;
  --line-soft:#2a376c;
  --text:#f6f7ff;
  --muted:#aab4d9;
  --accent:#60a5fa;
  --accent-soft:#24356c;
  --gold:#a78bfa;
  --gold-soft:rgba(167,139,250,.12);
  --danger:#fb7185;
  --red:#be123c;
  --yellow:#eab308;
  --green:#16a34a;
  --brown:#92400e;
  --blue:#2563eb;
  --pink:#ec4899;
  --black:#101631;
  --shadow:0 14px 42px rgba(0,0,0,.34);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080b1e;color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 25%,rgba(84,70,160,.36) 0,rgba(24,30,78,.18) 35%,transparent 62%),
    linear-gradient(180deg,#111734 0%,#080b1e 46%,#060918 100%);
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
}
button,input,select{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.975)}
.app{width:min(100%,920px);margin:0 auto;padding:14px 14px calc(28px + env(safe-area-inset-bottom))}
.top{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:4px 2px 13px;border-bottom:1px solid rgba(96,165,250,.14);margin-bottom:12px
}
.brandWrap{display:flex;align-items:center;gap:11px;min-width:0}
.logoOrb{
  width:44px;height:44px;flex:0 0 auto;border-radius:16px;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 32%,#5656c5 0,#222b7a 48%,#151b54 100%);
  border:1px solid rgba(167,139,250,.48);box-shadow:0 0 24px rgba(167,139,250,.18);
  color:var(--gold);font-size:20px;font-weight:900
}
.logoOrb{overflow:hidden}.logoOrb img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.brand{font-weight:900;letter-spacing:-.025em;font-size:20px;color:#fff;display:flex;align-items:center;gap:7px;white-space:nowrap}
.brandBadge{
  font-size:9px;line-height:1;padding:5px 7px;border-radius:999px;
  border:1px solid rgba(167,139,250,.34);background:rgba(167,139,250,.1);color:#c4b5fd;
  letter-spacing:.1em;text-transform:uppercase;font-weight:900
}
.subtitle{font-size:10px;color:rgba(165,180,252,.68);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode{
  display:grid;grid-template-columns:1fr 1fr;background:rgba(10,13,34,.74);padding:4px;
  border:1px solid rgba(54,68,122,.7);border-radius:15px;min-width:190px;box-shadow:inset 0 0 18px rgba(0,0,0,.2)
}
.mode button{
  border:1px solid transparent;border-radius:11px;padding:10px 13px;background:transparent;
  color:#98a5cb;font-size:11px;font-weight:900;transition:.15s
}
.mode button.active{
  color:#ddd6fe;background:rgba(167,139,250,.13);border-color:rgba(167,139,250,.42);
  box-shadow:0 0 18px rgba(167,139,250,.1)
}
.toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:11px;
  background:rgba(18,24,52,.88);border:1px solid rgba(96,165,250,.2);border-radius:17px;padding:9px 10px;
  box-shadow:0 10px 26px rgba(0,0,0,.16);backdrop-filter:blur(10px)
}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0}
.chip{
  background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.23);color:#c4b5fd;
  font-size:9px;font-weight:900;border-radius:10px;padding:6px 8px;text-transform:uppercase;letter-spacing:.07em
}
.chip.good{color:#93c5fd;border-color:rgba(96,165,250,.32);background:rgba(96,165,250,.09)}
.actions{display:flex;gap:5px;flex-shrink:0}
.iconBtn{
  width:37px;height:37px;border-radius:11px;border:1px solid rgba(72,86,140,.72);
  background:rgba(31,39,85,.64);color:#e4eaff;font-size:17px;display:grid;place-items:center;
  transition:.15s;box-shadow:inset 0 1px rgba(255,255,255,.03)
}
.iconBtn:hover{border-color:rgba(167,139,250,.42);color:#c4b5fd;background:rgba(54,68,122,.72)}
.iconBtn:disabled{opacity:.26}
.players{display:grid;gap:9px}
.players.p2{grid-template-columns:repeat(2,minmax(0,1fr))}
.players.p3{grid-template-columns:repeat(3,minmax(0,1fr))}
.players.p4{grid-template-columns:repeat(2,minmax(0,1fr))}
.player{
  min-width:0;border:1px solid rgba(54,68,122,.7);
  background:linear-gradient(160deg,rgba(24,30,67,.93),rgba(20,25,59,.9));
  border-radius:20px;padding:12px;text-align:left;color:var(--text);position:relative;overflow:hidden;
  box-shadow:0 10px 28px rgba(0,0,0,.22);transition:.18s
}
.player:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,rgba(96,165,250,.08),transparent 40%);pointer-events:none}
.player.active{
  border-color:#60a5fa;box-shadow:0 0 25px rgba(96,165,250,.25),0 12px 28px rgba(0,0,0,.28);
  outline:1px solid rgba(96,165,250,.35);outline-offset:-2px
}
.player .name{font-size:11px;color:#d2dcfd;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative}
.player.active .name{color:#c4b5fd}
.player .score{font-size:38px;line-height:1;font-weight:900;margin:7px 0 5px;font-variant-numeric:tabular-nums;position:relative}
.player .meta{font-size:9px;color:#9ba6ce;font-weight:700;position:relative}
.progress{height:5px;background:#151a38;border-radius:999px;overflow:hidden;margin-top:8px;position:relative}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#a78bfa,#fb7185);border-radius:999px}
.badge{
  display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:rgba(96,165,250,.12);color:#93c5fd;
  border:1px solid rgba(96,165,250,.3);padding:4px 7px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.05em
}
.status{
  margin-top:10px;background:rgba(24,30,67,.82);border:1px solid rgba(96,165,250,.2);border-radius:16px;
  padding:10px 12px;display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#a7b1d4;flex-wrap:wrap;
  box-shadow:0 8px 22px rgba(0,0,0,.15)
}
.status b{color:#fff;font-size:12px}.status span:first-child b{color:#c4b5fd}
.passPanel{
  margin-top:9px;border:1px solid rgba(167,139,250,.36);
  background:linear-gradient(135deg,rgba(111,81,180,.11),rgba(167,139,250,.055));
  border-radius:16px;padding:10px;box-shadow:0 0 22px rgba(167,139,250,.07)
}
.passTitle{font-size:9px;color:#c4b5fd;font-weight:900;text-transform:uppercase;letter-spacing:.11em;margin-bottom:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ballGrid{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;
  background:linear-gradient(160deg,rgba(24,30,67,.82),rgba(20,25,59,.68));
  border:1px solid rgba(79,97,164,.34);border-radius:20px;padding:10px
}
.ball{
  height:66px;border-radius:16px;border:1px solid rgba(255,255,255,.12);font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:inset -4px -5px 9px rgba(0,0,0,.42),0 7px 16px rgba(0,0,0,.24);transition:.14s
}
.ball:not(:disabled){outline:1px solid rgba(167,139,250,.22);outline-offset:-2px}
.ball:not(:disabled):hover{filter:brightness(1.08);box-shadow:inset -4px -5px 9px rgba(0,0,0,.35),0 0 16px rgba(167,139,250,.2)}
.ball strong{font-size:22px;line-height:1}.ball span{font-size:8px;letter-spacing:.06em;margin-top:5px;text-transform:uppercase}
.ball:disabled{opacity:.28;filter:grayscale(.6);cursor:not-allowed}
.red{background:linear-gradient(145deg,#e11d48,#881337);color:white}
.yellow{background:linear-gradient(145deg,#fde047,#ca8a04);color:#171717}
.green{background:linear-gradient(145deg,#22c55e,#166534);color:white}
.brown{background:linear-gradient(145deg,#b45309,#713f12);color:white}
.blue{background:linear-gradient(145deg,#3b82f6,#1e40af);color:white}
.pink{background:linear-gradient(145deg,#f472b6,#be185d);color:#171717}
.black{background:linear-gradient(145deg,#263246,#05070a);color:white}
.secondary,.danger,.primary,.smallBtn,.option,.tab,.filter,.close{transition:.14s}
.secondary{
  background:rgba(31,39,85,.72);border:1px solid rgba(72,86,140,.72);color:#e8efec;
  border-radius:14px;padding:12px;font-weight:850
}
.secondary:hover{background:rgba(54,68,122,.8);border-color:rgba(167,139,250,.28)}
.danger{
  background:rgba(94,58,152,.2);border:1px solid rgba(167,139,250,.35);color:#ddd6fe;
  border-radius:14px;padding:12px;font-weight:850
}
.danger:hover{background:rgba(104,69,175,.3)}
.primary{
  background:linear-gradient(145deg,#3446b8,#222b7a);border:1px solid rgba(167,139,250,.38);color:#fff;
  border-radius:14px;padding:12px;font-weight:900;box-shadow:0 0 22px rgba(167,139,250,.09)
}
.controls{margin-top:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.controls.century{grid-template-columns:repeat(2,1fr)}
.panel{
  margin-top:8px;border:1px solid rgba(79,97,164,.4);
  background:linear-gradient(150deg,rgba(24,30,67,.94),rgba(21,26,58,.92));
  border-radius:17px;padding:10px;box-shadow:0 8px 22px rgba(0,0,0,.18)
}
.panelLabel{font-size:9px;text-transform:uppercase;letter-spacing:.11em;color:#c4b5fd;margin-bottom:7px;font-weight:900}
.recent{
  margin-top:12px;border:1px solid rgba(79,97,164,.28);
  background:rgba(11,16,38,.5);border-radius:17px;padding:10px
}
.recentHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.recentHead .label{font-size:9px;color:#c4b5fd;text-transform:uppercase;letter-spacing:.12em;font-weight:900}
.smallBtn{
  border:1px solid rgba(72,86,140,.65);background:rgba(31,39,85,.62);color:#9faed5;
  border-radius:9px;padding:7px 9px;font-size:9px;font-weight:900
}
.smallBtn:hover{color:#c4b5fd;border-color:rgba(167,139,250,.35)}
.logline{
  font-size:10px;color:#a3afd4;background:rgba(24,30,67,.62);border:1px solid rgba(54,68,122,.48);
  border-radius:9px;padding:8px 9px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.winner{
  margin-top:11px;border:1px solid rgba(167,139,250,.42);
  background:radial-gradient(circle at 50% 0,rgba(167,139,250,.12),transparent 42%),linear-gradient(160deg,rgba(24,30,67,.96),rgba(20,25,59,.94));
  border-radius:23px;padding:19px;text-align:center;box-shadow:0 0 28px rgba(167,139,250,.12),var(--shadow)
}
.winner .eyebrow{font-size:9px;color:#c4b5fd;text-transform:uppercase;letter-spacing:.16em;font-weight:900}
.winner h2{margin:6px 0 10px;font-size:26px}.finalRow{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:5px 0;color:#aab4d9}.finalRow b{color:#f6f7ff}
.sheetBackdrop{
  position:fixed;inset:0;background:rgba(4,6,20,.84);display:none;align-items:center;justify-content:center;
  z-index:50;padding:14px;backdrop-filter:blur(10px)
}
.sheetBackdrop.show{display:flex}
.sheet{
  width:min(100%,590px);max-height:90vh;background:linear-gradient(160deg,#101631,#141b3a);
  border:1px solid rgba(167,139,250,.35);border-radius:26px;padding:14px 14px calc(18px + env(safe-area-inset-bottom));
  overflow:auto;box-shadow:0 0 28px rgba(167,139,250,.12),0 26px 60px rgba(0,0,0,.5)
}
.sheetHead{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;position:sticky;top:-14px;
  background:linear-gradient(180deg,#141933 75%,rgba(14,23,35,.94));padding:10px 0;z-index:2
}
.sheetTitle{font-size:13px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:#fff}
.close{width:35px;height:35px;border:1px solid rgba(72,86,140,.72);background:#222a50;color:#cbd5e1;border-radius:11px}
.tabs,.filters{display:flex;gap:6px;overflow:auto;padding-bottom:5px}
.tab,.filter{
  white-space:nowrap;border:1px solid rgba(72,86,140,.64);background:rgba(24,30,67,.8);color:#94a3b8;
  padding:9px 11px;border-radius:11px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.05em
}
.tab.active,.filter.active{background:rgba(167,139,250,.15);color:#c4b5fd;border-color:rgba(167,139,250,.45)}
.sectionTitle{font-size:9px;color:#c4b5fd;text-transform:uppercase;letter-spacing:.13em;font-weight:900;margin:15px 0 7px}
.field{margin-top:10px}
.field label{display:block;font-size:9px;color:#9aa7cb;margin-bottom:5px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
.field input,.field select{
  width:100%;background:#222a50;color:#f6f7ff;border:1px solid #3a497b;border-radius:13px;padding:12px;font-size:16px;outline:none
}
.field input:focus,.field select:focus{border-color:#a78bfa;box-shadow:0 0 0 2px rgba(167,139,250,.1)}
.inlineOptions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.option{border:1px solid #3a497b;background:#222a50;color:#cbd5e1;border-radius:12px;padding:11px;font-weight:850}
.option.active{background:rgba(167,139,250,.14);color:#c4b5fd;border-color:rgba(167,139,250,.45)}
.resultCard,.statCard{
  border:1px solid rgba(54,68,122,.72);background:linear-gradient(155deg,rgba(24,30,67,.92),rgba(20,25,59,.72));
  border-radius:15px;padding:11px;margin-top:8px
}
.resultTop{display:flex;justify-content:space-between;gap:8px}.resultMode{font-size:8px;text-transform:uppercase;color:#c4b5fd;font-weight:900;letter-spacing:.11em}
.resultDate{font-size:9px;color:#718079}.resultWinner{font-weight:900;margin-top:5px;font-size:13px}.resultScores{font-size:10px;color:#9ba9a3;margin-top:4px}
.resultDetails{display:none;border-top:1px solid rgba(54,68,122,.6);margin-top:8px;padding-top:7px}.resultCard.open .resultDetails{display:block}
.statName{font-weight:900;color:#f6f7ff}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.statBox{background:rgba(31,39,85,.62);border:1px solid rgba(54,68,122,.55);border-radius:10px;padding:8px;text-align:center}.statBox strong{display:block;font-size:15px}.statBox span{font-size:7px;text-transform:uppercase;color:#8b9a94}
.empty{padding:28px 10px;text-align:center;color:#7f8f88;font-size:11px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.summary>div{background:rgba(24,30,67,.72);border:1px solid rgba(79,97,164,.36);border-radius:12px;padding:10px;text-align:center}.summary strong{display:block;font-size:19px}.summary span{font-size:8px;color:#8d9d96;text-transform:uppercase}
.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#141c39;color:#f6f7ff;border:1px solid rgba(167,139,250,.32);border-radius:999px;padding:9px 13px;
  font-size:10px;z-index:80;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 10px 30px rgba(0,0,0,.38)
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.confirmBar{margin-top:8px;border:1px solid rgba(167,139,250,.32);background:rgba(94,58,152,.14);border-radius:14px;padding:10px}
.confirmBar p{margin:0 0 9px;font-size:11px;color:#e8ddd0}.row{display:flex;gap:7px}.row>*{flex:1}.kicker{font-size:9px;color:#86968f;margin-top:6px}
.lastActionCard{margin-top:10px;border:1px solid rgba(167,139,250,.32);background:linear-gradient(160deg,rgba(24,30,67,.9),rgba(17,23,56,.88));border-radius:18px;padding:11px 12px;box-shadow:0 8px 18px rgba(0,0,0,.18)}
.lastActionLabel{font-size:9px;color:#c4b5fd;text-transform:uppercase;letter-spacing:.12em;font-weight:900;margin-bottom:4px}
.lastActionText{font-size:13px;color:#f6f7ff;font-weight:800;line-height:1.35}
.controlDock{position:sticky;bottom:10px;z-index:12;padding-top:10px;margin-top:10px;background:linear-gradient(180deg,rgba(9,12,28,0) 0%,rgba(9,12,28,.7) 20%,rgba(9,12,28,.95) 60%,rgba(9,12,28,.98) 100%)}
.controls{align-items:stretch}
.controls.century{grid-template-columns:2fr 1fr}
.missPrimary{grid-column:span 1;min-height:76px;border-color:rgba(167,139,250,.48)!important;background:linear-gradient(145deg,#3446b8,#222b7a)!important;color:#fff!important;font-size:16px;display:flex;flex-direction:column;justify-content:center;gap:5px;box-shadow:0 0 22px rgba(96,165,250,.14),0 8px 20px rgba(0,0,0,.22)}
.missPrimary b{font-size:17px;letter-spacing:.02em}
.missPrimary small{font-size:10px;color:#d8ebe4}
.app.tableLandscape{width:min(100%,1320px);padding:10px 12px calc(18px + env(safe-area-inset-bottom))}
.app.tableLandscape .top{padding-bottom:9px;margin-bottom:8px}
.app.tableLandscape .toolbar{margin-bottom:8px;padding:10px 12px}
.app.tableLandscape .players.p4{grid-template-columns:repeat(4,minmax(0,1fr))}
.app.tableLandscape .player{padding:14px;border-radius:22px}
.app.tableLandscape .player .name{font-size:14px}
.app.tableLandscape .player .score{font-size:48px;margin:10px 0 6px}
.app.tableLandscape .player .meta{font-size:11px}
.app.tableLandscape .badge{font-size:10px;padding:5px 8px}
.app.tableLandscape .status{font-size:13px;padding:13px 14px;border-radius:18px}
.app.tableLandscape .status b{font-size:18px}
.app.tableLandscape .lastActionCard{margin-top:8px;padding:13px 14px}
.app.tableLandscape .lastActionText{font-size:15px}
.app.tableLandscape .passPanel{padding:12px}
.app.tableLandscape .ballGrid{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:12px;border-radius:22px}
.app.tableLandscape .ball{height:84px;border-radius:18px}
.app.tableLandscape .ball strong{font-size:28px}
.app.tableLandscape .ball span{font-size:10px}
.app.tableLandscape .controls{grid-template-columns:2fr 1fr 1fr;gap:10px}
.app.tableLandscape .controls.century{grid-template-columns:2fr 1fr}
.app.tableLandscape .missPrimary{min-height:88px;font-size:18px}
.app.tableLandscape .recent{margin-top:8px}
.app.tableLandscape .recentHead .label{font-size:11px}
.app.tableLandscape .logline{font-size:12px;padding:10px 12px}
.app.tableLandscape .winner h2{font-size:32px}
@media (orientation: landscape){.app{width:min(100%,1320px);padding:10px 12px calc(18px + env(safe-area-inset-bottom))}.players.p4{grid-template-columns:repeat(4,minmax(0,1fr))}.player .score{font-size:44px}.status{font-size:12px}.status b{font-size:16px}.ballGrid{grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;padding:12px}.ball{height:80px}.ball strong{font-size:26px}.ball span{font-size:10px}.controls{grid-template-columns:2fr 1fr 1fr}.controls.century{grid-template-columns:2fr 1fr}.missPrimary{min-height:84px}.lastActionText{font-size:14px}}

.slotCard,.rosterCard{background:linear-gradient(180deg,rgba(24,30,67,.26),rgba(21,26,58,.5));border:1px solid rgba(29,73,59,.9);border-radius:18px;padding:12px;margin-bottom:10px}
.slotHead,.rosterHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.slotTitle,.rosterTitle{font-size:12px;font-weight:900;color:#f6f7ff}
.slotMeta{font-size:10px;color:var(--muted);font-weight:700}
.seatDot{width:11px;height:11px;border-radius:999px;display:inline-block;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 0 10px rgba(255,255,255,.08)}
.nameRow{display:flex;align-items:center;gap:7px;min-width:0}
.nameRow .nameText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

 background:linear-gradient(160deg,#222931,#10161d) !important;
 border:1px solid #35404a;border-radius:14px;color:#f7f8fa;

}

.cueOrb{
 --orb-hi:#efefef;--orb:#aaa;--orb-deep:#3c3c3c;
 display:block;width:58px;height:58px;min-height:58px;max-width:72%;
 border-radius:50%;position:relative;flex:none;
 background:
 radial-gradient(ellipse 17% 12% at 27% 18%,rgba(255,255,255,.95),transparent 85%),
 radial-gradient(circle at 33% 24%,var(--orb-hi) 0%,var(--orb) 38%,var(--orb-deep) 81%,#080a0e 100%);
 box-shadow:
 inset -6px -8px 10px rgba(0,0,0,.57),
 inset 3px 4px 6px rgba(255,255,255,.26),
 0 6px 7px rgba(0,0,0,.62),
 0 12px 13px rgba(0,0,0,.28);
}
.cueOrb:before{
 content:"";position:absolute;top:11%;left:17%;width:32%;height:20%;
 background:linear-gradient(140deg,rgba(255,255,255,.94),rgba(255,255,255,.28));
 border-radius:70% 35% 55% 25%;transform:rotate(-32deg);
 filter:blur(.6px);opacity:.92
}
.cueOrb:after{
 content:"";position:absolute;bottom:10%;right:18%;width:26%;height:6%;
 background:rgba(255,255,255,.24);border-radius:50%;transform:rotate(-26deg);filter:blur(3px)
}
.cueOrb.red{--orb-hi:#ff5662;--orb:#dd001c;--orb-deep:#550008}
.cueOrb.yellow{--orb-hi:#fff48e;--orb:#f2be00;--orb-deep:#825600}
.cueOrb.green{--orb-hi:#75f8b2;--orb:#009c3b;--orb-deep:#034b26}
.cueOrb.brown{--orb-hi:#eeaf86;--orb:#98512d;--orb-deep:#391708}
.cueOrb.blue{--orb-hi:#84c8ff;--orb:#0876d9;--orb-deep:#072e80}
.cueOrb.pink{--orb-hi:#ffd7df;--orb:#ec6594;--orb-deep:#8b194e}
.cueOrb.black{--orb-hi:#5d6269;--orb:#131922;--orb-deep:#020308}
.cueOrb.white{--orb-hi:#fff;--orb:#edebea;--orb-deep:#85828b}
.ballGrid .ball .cueBallName,.passPanel .ball .cueBallName{

  {id:"cyan",label:"Cyan",hex:"#06b6d4"}

const seatMap=Object.fromEntries(seatPalette.map(x=>[x.id,x]));

function syncCenturyNames(){cSettings.names=cSettings.slots.slice(0,4).map((sl,i)=>resolveSlotName(sl,i))}

function appHeader(){return `<div class="top"><div class="brandWrap"><div class="logoOrb"><img src="cuescore-icon.png" alt="CueScore red-ball triangle logo"></div><div><div class="brand">CUESCORE <span class="brandBadge">CLUB SNOOKER</span></div><div class="subtitle">${mode==="century"?"CENTURY MODE":"SNOOKER MODE"} · YOUR TABLE. YOUR RULES.</div></div></div><div class="mode" role="group" aria-label="Game mode"><button data-mode="century" class="${mode==="century"?"active":""}">Century</button><button data-mode="snooker" class="${mode==="snooker"?"active":""}">Snooker</button></div></div>`}function toolBar(canUndo,canRedo,chips){canUndo=canUndo&&!scoreLocked;canRedo=canRedo&&!scoreLocked;return `<div class="toolbar"><div class="chips">${chips}${isTableLayout()?`<span class="chip good">📺 TABLE VIEW</span>`:""}</div><div class="actions"><button class="iconBtn" id="tableBtn" aria-label="Toggle table mode" title="Toggle table mode">${tableMode?"🗖":"🗗"}</button><button class="iconBtn" id="swapSeatsBtn" aria-label="Arrange seats" title="Arrange seats">⇄</button><button class="iconBtn" id="logBtn" aria-label="Log and history" title="Log & history">☰</button><button class="iconBtn" id="undoBtn" aria-label="Undo" title="Undo" ${canUndo?"":"disabled"}>↶</button><button class="iconBtn" id="redoBtn" aria-label="Redo" title="Redo" ${canRedo?"":"disabled"}>↷</button><button class="iconBtn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button></div></div>`}function lastActionHTML(log,fallback){const item=log&&log.length?esc(log[0].text):fallback;return `<div class="lastActionCard"><div class="lastActionLabel">Last action</div><div class="lastActionText">${item}</div></div>`}function recentHTML(log,limit,newLabel){const arr=(log||[]).slice(0,limit);return `<div class="recent"><div class="recentHead"><span class="label"><i class="liveDot"></i> Live activity</span><div><button class="smallBtn" id="viewAll">View all</button> <button class="smallBtn" id="newBtn">${newLabel}</button></div></div>${arr.length?arr.map(h=>`<div class="logline">${esc(h.text)}</div>`).join(""):`<div class="logline">No actions yet.</div>`}</div>`}
const seatLayoutKey="centurySnooker.visualSeats.v1";
let visualLayouts=read(seatLayoutKey,{});
function displaySeatOrder(which=mode){
 const st=which==="century"?cState:sState,n=which==="century"?st.players.length:st.scores.length;
 const saved=visualLayouts[which],fallback=Array.from({length:n},(_,i)=>i);
 const valid=saved&&saved.gameId===st.gameId&&Array.isArray(saved.order)&&saved.order.length===n&&new Set(saved.order).size===n&&saved.order.every(v=>Number.isInteger(v)&&v>=0&&v<n);
 if(!valid){visualLayouts[which]={gameId:st.gameId,order:fallback};write(seatLayoutKey,visualLayouts)}
 return visualLayouts[which].order.slice();
}
function nextVisualIndex(current,which=mode){const order=displaySeatOrder(which),pos=order.indexOf(current);return pos<0?current:order[(pos+1)%order.length]}
function placePlayerAtSeat(order,seat,player){const arr=order.slice(),from=arr.indexOf(player);if(!Number.isInteger(seat)||seat<0||seat>=arr.length||from<0)return arr;[arr[seat],arr[from]]=[arr[from],arr[seat]];return arr}
function saveSeatArrangement(order){if(scoreLocked)return false;const current=displaySeatOrder(),st=mode==="century"?cState:sState;if(!Array.isArray(order)||order.length!==current.length||new Set(order).size!==order.length||order.some(i=>!current.includes(i)))return false;visualLayouts[mode]={gameId:st.gameId,order:order.slice()};write(seatLayoutKey,visualLayouts);render();return true}
function swapDisplayedSeats(a,b){if(scoreLocked){showToast("Unlock scoring first");return false}
 const order=displaySeatOrder();
 if(!Number.isInteger(a)||!Number.isInteger(b)||a<0||b<0||a>=order.length||b>=order.length||a===b)return false;
 [order[a],order[b]]=[order[b],order[a]];
 visualLayouts[mode]={gameId:(mode==="century"?cState:sState).gameId,order};
 write(seatLayoutKey,visualLayouts);render();return true;
}
function showSeatSwap(){openPanel="seats";renderSheet()}
function renderSeatSheet(sheet){
 const order=displaySeatOrder();let draft=order.slice();
 const name=i=>mode==="century"?cDisplayName(i):sDisplayName(i);
 const options=order.map(i=>({id:i,name:name(i)}));
 sheet.innerHTML=`<div class="sheetHead"><div class="sheetTitle">Arrange seats</div><button class="close" id="x">×</button></div>
 <div class="seatDirection">LEFT <span>→</span> RIGHT <span>↩</span></div>
 <div class="smallNote">Choose who sits where. Next turn always goes to the seat on the right, wrapping back to Seat 1.</div>
 <div class="seatPickerList">${draft.map((id,pos)=>`<label class="seatPickerRow"><span>Seat ${pos+1}</span><select data-seat="${pos}" aria-label="Person in seat ${pos+1}">${options.map(p=>`<option value="${p.id}" ${p.id===id?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label>`).join("")}</div>
 <button class="primary seatPickerApply" id="applySeatArrangement">OK</button>`;
 sheet.querySelector("#x").onclick=closeSheet;
 const selectors=Array.from(sheet.querySelectorAll("[data-seat]"));
 selectors.forEach(sel=>sel.onchange=()=>{draft=placePlayerAtSeat(draft,Number(sel.dataset.seat),Number(sel.value));selectors.forEach((e,i)=>e.value=String(draft[i]))});
 sheet.querySelector("#applySeatArrangement").onclick=()=>{if(saveSeatArrangement(draft)){closeSheet();showToast("Seats updated")}else showToast("Unable to change seats")};
}
function safetyBarHTML(){return '<div class="safetyBar"><button type="button" id="scoreLockBtn" class="'+(scoreLocked?"locked":"unlocked")+'" aria-pressed="'+scoreLocked+'" aria-label="'+(scoreLocked?"Hold to unlock scoring":"Lock scoring")+'">'+(scoreLocked?"🔒 HOLD TO UNLOCK":"🔓 LOCK SCORING")+'</button><button type="button" id="swapSeatsQuick">⇄ Arrange seats</button></div>'}
function cueBallHTML(name,value,color,penalty=false){return `<span class="cueOrb ${color}" aria-hidden="true"></span><span class="cueBallName">${esc(name)}</span><strong class="cueBallValue">${penalty?"−":""}${value}</strong>`}
function centuryHTML(){const pc=cState.players.length,act=cState.players[cState.active],players=displaySeatOrder("century").map((i,visual)=>{const p=cState.players[i];const left=Math.max(0,cSettings.target-p.score),pct=Math.max(0,Math.min(100,p.score/cSettings.target*100));return `<button class="player ${i===cState.active?"active":""}" data-cplayer="${i}"><div class="name">${playerNameHTML(cDisplayName(i),{...(cState.matchRefs?.[i]||cSettings.slots[i]),seatColor:cSettings.slots[visual]?.seatColor||defaultSeat(visual)})}</div><div class="score">${p.score}</div><div class="meta">${left} left · high ${p.best} ${typeBadgeHTML((cState.matchRefs?.[i]||cSettings.slots[i])?.kind)}</div><div class="progress"><i style="width:${pct}%"></i></div>${p.freeReds>0?`<div class="badge">FREE RED ×${p.freeReds}</div>`:""}</button>`}).join(""),chips=`<span class="chip">🎯 Target ${cSettings.target}</span>${cProtected()?`<span class="chip good">🛡 Protected</span>`:`<span class="chip">−10 Red Miss</span>`}`;let body=appHeader()+toolBar(cTL.past.length>0,cTL.future.length>0,chips)+timerRibbonHTML()+safetyBarHTML()+`<div class="players p${pc}">${players}</div>`;if(cState.winner!==null){body+=`<div class="winner"><div class="eyebrow">Winner</div><h2>${esc(cDisplayName(cState.winner))}</h2>${cState.players.map((p,i)=>`<div class="finalRow"><span>${esc(cDisplayName(i))}</span><b>${p.score} · high ${p.best}</b></div>`).join("")}<div class="two" style="margin-top:9px"><button class="primary" id="winnerNew">New game</button><button class="secondary" id="viewResult">View result</button></div></div>`}else{body+=`<div class="status"><span>Shooting <b>${esc(cDisplayName(cState.active))}</b></span><span>Visit <b>${cState.visit}</b></span><span>Needed <b>${Math.max(0,cSettings.target-act.score)}</b></span></div>`;body+=lastActionHTML(cState.log,"Ready for the next shot.");if(act.freeReds>0)body+=`<div class="passPanel"><div class="passTitle">${act.freeReds} free-red ${act.freeReds===1?"pass":"passes"}</div><div class="two"><button class="red ball" id="freePot">${cueBallHTML("Pot free red",10,"red")}</button><button class="secondary" id="freeMiss">Miss · spend 1</button></div></div>`;body+=`<div class="ballGrid">${[["Red",10,"red"],["Yellow",2,"yellow"],["Green",3,"green"],["Brown",4,"brown"],["Blue",5,"blue"],["Pink",6,"pink"],["Black",7,"black"]].map(([n,v,c])=>`<button class="ball ${c}" data-cpot="${v}" data-name="${n}" ${(subPanel==="cfoul"||cCanScore(v))?"":"disabled"}>${cueBallHTML(n,v,c,subPanel==="cfoul")}</button>`).join("")}<button class="ball missRedTile" id="missRed"><span class="cueOrb white missCueOrb" aria-hidden="true"><i>×</i></span><span class="cueBallName">MISS RED</span><strong class="cueBallValue">${cProtected()?"free passes":"−10 · end"}</strong></button></div><div class="controlDock"><div class="controls century"><button class="secondary missPrimary" id="missNext"><b>MISS / END TURN <span aria-hidden="true">›</span></b></button><button class="danger" id="foulToggle">${subPanel==="cfoul"?"Cancel foul":"Foul"}</button></div></div>${subPanel==="cfoul"?`<div class="panel"><div class="panelLabel">FOUL MODE · Tap a ball above to deduct its value from the shooter. Tap Cancel foul to exit.</div></div>`:""}`}body+=recentHTML(cState.log,4,"New game");return body}
function sBallButton(name,value,cls,key){return `<button class="ball ${cls}" data-spot="${key}" ${(subPanel==="sfoul"||sCanPot(key))?"":"disabled"}>${cueBallHTML(name,value,cls,subPanel==="sfoul")}</button>`}function freePanelHTML(){const generic=sState.ballOn==="colour"&&!sState.clearance;return `<div class="panel"><div class="panelLabel">Free ball${generic?" · choose actual ball-on value":""}</div>${generic?`<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-bottom:7px">${[2,3,4,5,6,7].map(v=>`<button class="option ${freeBallOnValue===v?"active":""}" data-onv="${v}">${v}</button>`).join("")}</div>`:""}<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px">${colors.map(([k,n])=>`<button class="ball ${k}" style="height:46px" data-free="${k}" ${generic&&!freeBallOnValue?"disabled":""}><strong style="font-size:14px">${n.slice(0,3)}</strong></button>`).join("")}</div></div>`}
function snookerHTML(){const chips=`<span class="chip">🔴 ${sState.reds} Reds</span><span class="chip good">${sState.respotted?"⚫ RESPOTTED BLACK":sState.ballOn==="colour"?"● COLOUR ON":"● "+String(sState.ballOn).toUpperCase()+" ON"}</span>`;let body=appHeader()+toolBar(sTL.past.length>0,sTL.future.length>0,chips)+timerRibbonHTML()+safetyBarHTML()+`<div class="players p2">${displaySeatOrder("snooker").map((i,visual)=>{const sc=sState.scores[i];return `<button class="player ${i===sState.active?"active":""}" data-splayer="${i}"><div class="name">${playerNameHTML(sDisplayName(i),{...(sState.matchRefs?.[i]||sSettings.slots[i]),seatColor:sSettings.slots[visual]?.seatColor||defaultSeat(visual)})}</div><div class="score">${sc}</div><div class="meta">${i===sState.active?"Break "+sState.break:"High "+sState.best[i]} ${typeBadgeHTML((sState.matchRefs?.[i]||sSettings.slots[i])?.kind)}</div></button>`}).join("")}</div>`;if(sState.winner!==null){body+=`<div class="winner"><div class="eyebrow">Frame winner</div><h2>${esc(sDisplayName(sState.winner))}</h2><div class="finalRow"><span>${esc(sDisplayName(0))}</span><b>${sState.scores[0]} · high ${sState.best[0]}</b></div><div class="finalRow"><span>${esc(sDisplayName(1))}</span><b>${sState.scores[1]} · high ${sState.best[1]}</b></div><div class="kicker">${esc(sState.reason||"")}</div><div class="two" style="margin-top:9px"><button class="primary" id="winnerNew">New frame</button><button class="secondary" id="viewResult">View result</button></div></div>`}else{const rem=sState.respotted?7:(sState.clearance?clearance.slice(Math.max(0,clearance.indexOf(sState.ballOn))).reduce((a,c)=>a+val[c],0):sState.reds*8+27+(sState.ballOn==="colour"?7:0));body+=`<div class="status"><span>Striker <b>${esc(sDisplayName(sState.active))}</b></span><span>Break <b>${sState.break}</b></span><span>Remaining <b>${rem}</b></span></div>`+lastActionHTML(sState.log,"Ready for the next shot.")+`<div class="ballGrid">${sBallButton("Red",1,"red","red")}${colors.map(([k,n,v])=>sBallButton(n,v,k,k)).join("")}</div><div class="controlDock"><div class="controls"><button class="secondary missPrimary" id="sMiss"><b>MISS / END TURN <span aria-hidden="true">›</span></b></button><button class="danger" id="sFoulToggle">${subPanel==="sfoul"?"Cancel foul":"Foul"}</button><button class="secondary" id="freeToggle" ${sState.respotted?"disabled":""}>Free ball</button></div></div>${subPanel==="sfoul"?`<div class="panel"><div class="panelLabel">FOUL MODE · Tap any ball above to deduct its value from the shooter.</div></div>`:""}${subPanel==="free"?freePanelHTML():""}<div style="margin-top:8px;text-align:right"><button class="smallBtn" id="concede">Concede frame</button></div>`}body+=recentHTML(sState.log,5,"New frame");return body}
function render(){document.title="CueScore · "+(mode==="century"?"Century":"Snooker");const app=document.getElementById("app");app.className="app"+(isTableLayout()?" tableLandscape":"");document.body.classList.toggle("table-landscape",isTableLayout());app.innerHTML=mode==="century"?centuryHTML():snookerHTML();bindMain();if(openPanel==="history"||openPanel==="settings"||openPanel==="timer"||openPanel==="seats")renderSheet()}
function bindMain(){document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));const tb=document.getElementById("tableBtn");if(tb)tb.onclick=toggleTableMode;document.getElementById("clubTimerBtn").onclick=openTimer;document.getElementById("swapSeatsBtn").onclick=()=>scoreLocked?showToast("Unlock scoring first"):showSeatSwap();document.getElementById("swapSeatsQuick").onclick=()=>scoreLocked?showToast("Unlock scoring first"):showSeatSwap();const lockBtn=document.getElementById("scoreLockBtn");if(scoreLocked){let hold=null;const begin=e=>{e.preventDefault();if(hold!==null)return;hold=setTimeout(()=>{hold=null;setScoringLock(false);showToast("Scoring unlocked")},750)};const cancel=()=>{if(hold!==null)clearTimeout(hold);hold=null};lockBtn.onpointerdown=begin;lockBtn.onpointerup=cancel;lockBtn.onpointercancel=cancel;lockBtn.onpointerleave=cancel;lockBtn.onkeydown=e=>{if((e.key==="Enter"||e.key===" ")&&!e.repeat)begin(e)};lockBtn.onkeyup=e=>{if(e.key==="Enter"||e.key===" ")cancel()};lockBtn.onclick=e=>{e.preventDefault();if(scoreLocked)showToast("Hold to unlock")}}else lockBtn.onclick=()=>setScoringLock(true);document.getElementById("logBtn").onclick=()=>openHistory("log");document.getElementById("settingsBtn").onclick=openSettings;document.getElementById("viewAll").onclick=()=>openHistory("log");if(mode==="century"){document.getElementById("undoBtn").onclick=cUndo;document.getElementById("redoBtn").onclick=cRedo;document.querySelectorAll("[data-cplayer]").forEach(b=>b.onclick=()=>cSelect(Number(b.dataset.cplayer)));document.querySelectorAll("[data-cpot]").forEach(b=>b.onclick=()=>{const v=Number(b.dataset.cpot);if(subPanel==="cfoul"){subPanel=null;cFoul(v)}else cPot(b.dataset.name,v)});const fp=document.getElementById("freePot");if(fp)fp.onclick=()=>cPot("Red",10,true);const fm=document.getElementById("freeMiss");if(fm)fm.onclick=cFreeMiss;const mr=document.getElementById("missRed");if(mr)mr.onclick=cMissRed;const mn=document.getElementById("missNext");if(mn)mn.onclick=cMissNext;const ft=document.getElementById("foulToggle");if(ft)ft.onclick=()=>{if(scoreLocked){showToast("Scoring locked");return}subPanel=subPanel==="cfoul"?null:"cfoul";render()};const nb=document.getElementById("newBtn");if(nb)nb.onclick=()=>cState.winner!==null?cReset():(cHasProgress()?askConfirm("Start a new Century game and discard the current unfinished game?",cReset):cReset());const wn=document.getElementById("winnerNew");if(wn)wn.onclick=cReset;const vr=document.getElementById("viewResult");if(vr)vr.onclick=()=>openHistory("results")}else{document.getElementById("undoBtn").onclick=sUndo;document.getElementById("redoBtn").onclick=sRedo;document.querySelectorAll("[data-splayer]").forEach(b=>b.onclick=()=>sSelect(Number(b.dataset.splayer)));document.querySelectorAll("[data-spot]").forEach(b=>b.onclick=()=>{const ball=b.dataset.spot;if(subPanel==="sfoul"){subPanel=null;sFoul(ball==="red"?1:val[ball])}else sPot(ball)});const sm=document.getElementById("sMiss");if(sm)sm.onclick=sMiss;const sf=document.getElementById("sFoulToggle");if(sf)sf.onclick=()=>{if(scoreLocked){showToast("Scoring locked");return}subPanel=subPanel==="sfoul"?null:"sfoul";render()};const fr=document.getElementById("freeToggle");if(fr)fr.onclick=()=>{subPanel=subPanel==="free"?null:"free";freeBallOnValue=null;render()};document.querySelectorAll("[data-onv]").forEach(b=>b.onclick=()=>{freeBallOnValue=Number(b.dataset.onv);render()});document.querySelectorAll("[data-free]").forEach(b=>b.onclick=()=>{subPanel=null;sFreeBall(b.dataset.free)});const cc=document.getElementById("concede");if(cc)cc.onclick=()=>askConfirm("Concede this frame?",sConcede);const nb=document.getElementById("newBtn");if(nb)nb.onclick=()=>sState.winner!==null?sReset():(sHasProgress()?askConfirm("Start a new snooker frame and discard the current unfinished frame?",sReset):sReset());const wn=document.getElementById("winnerNew");if(wn)wn.onclick=sReset;const vr=document.getElementById("viewResult");if(vr)vr.onclick=()=>openHistory("results")}}
document.getElementById("sheetBackdrop").addEventListener("click",e=>{if(e.target.id==="sheetBackdrop")closeSheet()});if(window.matchMedia){const mq=window.matchMedia("(orientation: landscape)");if(mq.addEventListener)mq.addEventListener("change",()=>{if(!tableMode)render()});else if(mq.addListener)mq.addListener(()=>{if(!tableMode)render()})}syncCResult();syncSResult();saveCentury();saveSnooker();render();setInterval(updateTimerDisplay,1000);document.addEventListener("visibilitychange",updateTimerDisplay);
